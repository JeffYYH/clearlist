[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-csv-preparer"
version = "1.0.0"
description = "Reviewable CSV preparation for customer imports"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "Flask-WTF>=1.2,<2", "gunicorn>=23,<26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csv_cleaner = ["templates/*.html", "static/*.css", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
